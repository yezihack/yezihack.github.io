<!-- 悬浮球菜单 -->
<div class="floating-menu-container">
    <!-- 悬浮球按钮 -->
    <button class="floating-btn" id="floatingBtn" aria-label="打开导航菜单">
        <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>

    <!-- 菜单项 -->
    <div class="floating-menu-items" id="floatingMenuItems">
        <a href="/bookmark/" class="menu-item" title="网站导航">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>导航</span>
        </a>
        <a href="/posts/" class="menu-item" title="文章列表">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span>文章</span>
        </a>
        <a href="/categories/" class="menu-item" title="分类">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            <span>分类</span>
        </a>
        <a href="/tags/" class="menu-item" title="标签">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
            <span>标签</span>
        </a>
        <button class="menu-item scroll-top-btn" id="scrollTopBtn" title="返回顶部">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
            <span>顶部</span>
        </button>
    </div>
</div>

<script>
(function() {
    const floatingBtn = document.getElementById('floatingBtn');
    const menuItems = document.getElementById('floatingMenuItems');
    const scrollTopBtn = document.getElementById('scrollTopBtn');
    let isMenuOpen = false;

    // 切换菜单
    floatingBtn.addEventListener('click', function() {
        isMenuOpen = !isMenuOpen;
        floatingBtn.classList.toggle('active', isMenuOpen);
        menuItems.classList.toggle('active', isMenuOpen);
    });

    // 点击页面其他地方关闭菜单
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.floating-menu-container') && isMenuOpen) {
            isMenuOpen = false;
            floatingBtn.classList.remove('active');
            menuItems.classList.remove('active');
        }
    });

    // 返回顶部
    scrollTopBtn.addEventListener('click', function(e) {
        e.preventDefault();
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
        // 关闭菜单
        isMenuOpen = false;
        floatingBtn.classList.remove('active');
        menuItems.classList.remove('active');
    });

    // 滚动时显示/隐藏悬浮球
    let lastScrollTop = 0;
    window.addEventListener('scroll', function() {
        const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
        const container = document.querySelector('.floating-menu-container');

        if (scrollTop > 300) {
            container.classList.add('visible');
        } else {
            container.classList.remove('visible');
        }

        lastScrollTop = scrollTop;
    });
})();
</script>
