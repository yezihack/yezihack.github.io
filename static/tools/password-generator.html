<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 随机密码生成器</title>
    <link rel="stylesheet" href="password-generator.css">
</head>
<body>
    <div class="container">
        <!-- 导航栏 -->
        <header class="navbar">
            <div class="nav-content">
                <h1 class="logo">🔐 密码生成器</h1>
                <div class="nav-controls">
                    <a href="/" class="back-btn" title="返回博客">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                            <polyline points="9 22 9 12 15 12 15 22"></polyline>
                        </svg>
                        <span>博客</span>
                    </a>
                    <a href="/bookmark/" class="back-btn" title="网站导航">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span>导航</span>
                    </a>
                    <button id="themeToggle" class="theme-toggle" title="切换主题">
                        <span class="theme-icon">🌙</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- 主内容 -->
        <main class="main-content">
            <div class="generator-card">
                <!-- 字符类型选择 -->
                <div class="section">
                    <h3 class="section-title">字符类型</h3>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" id="lowercase" checked>
                            <span class="checkbox-label">小写字母 (a-z)</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="uppercase" checked>
                            <span class="checkbox-label">大写字母 (A-Z)</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="numbers" checked>
                            <span class="checkbox-label">数字 (0-9)</span>
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" id="symbols" checked>
                            <span class="checkbox-label">特殊字符 (!@#$%)</span>
                        </label>
                    </div>
                </div>

                <!-- 排除字符 -->
                <div class="section">
                    <h3 class="section-title">排除字符（可选）</h3>
                    <input type="text" id="excludeChars" class="input-field" placeholder="例如: il1oO0">
                </div>

                <!-- 密码长度和数量 -->
                <div class="section">
                    <div class="controls-row">
                        <div class="control-group">
                            <label class="control-label">密码长度</label>
                            <div class="slider-container">
                                <input type="range" id="lengthSlider" min="6" max="32" value="16" class="slider">
                                <span class="slider-value" id="lengthValue">16</span>
                            </div>
                        </div>
                        <div class="control-group">
                            <label class="control-label">生成数量</label>
                            <div class="number-input">
                                <button class="number-btn" id="decreaseCount">-</button>
                                <input type="number" id="passwordCount" min="1" max="10" value="1" readonly>
                                <button class="number-btn" id="increaseCount">+</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 生成按钮 -->
                <button class="generate-btn" id="generateBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        <path d="M9 12l2 2 4-4"></path>
                    </svg>
                    生成密码
                </button>

                <!-- 密码结果 -->
                <div class="results" id="results"></div>

                <!-- 历史记录 -->
                <div class="section">
                    <div class="history-header">
                        <label class="checkbox-item">
                            <input type="checkbox" id="saveHistory" checked>
                            <span class="checkbox-label">保存历史记录</span>
                        </label>
                        <button class="clear-btn" id="clearHistory">清空历史</button>
                    </div>
                    <div class="history-list" id="historyList"></div>
                </div>
            </div>

            <!-- 安全提示 -->
            <div class="tips-card">
                <h3>💡 密码安全建议</h3>
                <ul>
                    <li>建议密码长度至少 12 位</li>
                    <li>包含大小写字母、数字和特殊字符</li>
                    <li>不要使用个人信息（生日、姓名等）</li>
                    <li>不同网站使用不同密码</li>
                    <li>定期更换重要账户密码</li>
                    <li>使用密码管理器保存密码</li>
                </ul>
            </div>
        </main>
    </div>

    <!-- 悬浮球菜单 -->
    <div class="floating-menu-container">
        <button class="floating-btn" id="floatingBtn">
            <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <div class="floating-menu-items" id="floatingMenuItems">
            <a href="/" class="menu-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>博客</span>
            </a>
            <a href="/bookmark/" class="menu-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
                </svg>
                <span>导航</span>
            </a>
            <button class="menu-item scroll-top-btn" id="scrollTopBtn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
                <span>顶部</span>
            </button>
        </div>
    </div>

    <script src="password-generator.js"></script>
</body>
</html>
