# ========================================
# GitHub Pages 自动部署工作流
# 功能: 当代码推送到指定分支时,自动构建 Hugo 站点并部署到 GitHub Pages
# ========================================
name: GitHub Pages

# ========================================
# 触发条件配置
# ========================================
on:
  push:
    branches:
      - kong-htop  # 监听 kong-htop 分支的推送事件,当此分支有新提交时触发工作流
  # pull_request:  # PR 触发已禁用(如需启用,取消此行注释)
  workflow_dispatch

# ========================================
# 工作流任务定义
# ========================================
jobs:
  deploy:
    # 指定运行环境为 Ubuntu 最新版本
    runs-on: ubuntu-latest

    # 并发控制: 确保同一分支的工作流不会并发执行
    # 如果有新的提交推送,会取消正在运行的旧工作流
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}

    # ========================================
    # 部署步骤
    # ========================================
    steps:
      # --------------------------------------------------
      # 步骤 1: 检出代码
      # --------------------------------------------------
      - uses: actions/checkout@v3
        with:
          # 递归拉取子模块(Hugo 主题通常作为 Git 子模块存在)
          # true: 拉取一层子模块, recursive: 递归拉取所有嵌套子模块
          submodules: true

          # 拉取完整的 Git 历史记录
          # 0 表示拉取所有历史,这样 Hugo 可以使用 .GitInfo 和 .Lastmod 获取文件修改时间
          # 非 0 值会限制拉取的提交数量,可能导致某些 Hugo 功能无法正常工作
          fetch-depth: 0

      # --------------------------------------------------
      # 步骤 2: 安装 Hugo
      # --------------------------------------------------
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          # 指定 Hugo 版本(与本地开发环境保持一致,避免兼容性问题)
          # hugo-version: '0.100.2'  # 旧版本(已注释)
          hugo-version: '0.114.0'     # 当前使用版本

          # 是否使用 Hugo Extended 版本
          # Extended 版本支持 SCSS/SASS 编译,如果主题需要则设置为 true
          extended: false

      # --------------------------------------------------
      # 步骤 3: 构建 Hugo 站点
      # --------------------------------------------------
      - name: Build
        # --minify: 压缩 HTML/CSS/JS,减小文件体积,提升加载速度
        # 构建结果默认输出到 ./public 目录
        run: |
          hugo --minify
          echo "=== 检查 bookmark 目录 ==="
          ls -la public/bookmark/ || echo "bookmark 目录不存在"

      # --------------------------------------------------
      # 步骤 4: 部署到 GitHub Pages
      # --------------------------------------------------
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3

        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true

        # # 条件判断: 仅在 blog-poison 分支触发部署
        # # 注意: 此处分支名与触发条件中的 blog-htop 不一致,可能导致部署失败
        # # 建议修改为: github.ref == 'refs/heads/blog-htop'
        # if: ${{ github.ref == 'refs/heads/kong-htop' }}

        # with:
        #   # GitHub Token 用于推送到 gh-pages 分支
        #   # GITHUB_TOKEN 是 GitHub Actions 自动创建的临时 token
        #   # 无需手动配置,具有仓库的读写权限
        #   # 注意: 这不是个人访问令牌(Personal Access Token)
        #   github_token: ${{ secrets.GITHUB_TOKEN }}

        #   # 指定要部署的目录(Hugo 构建输出目录)
        #   # 此目录的内容会被推送到 gh-pages 分支,作为静态网站托管
        #   publish_dir: ./public
