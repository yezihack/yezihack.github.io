baseURL = 'https://yezihack.github.io/'
languageCode = 'en-us'
title = "空树之空"
theme = "kong-htop"
paginate = 10
pluralizelisttitles = false
enableRobotsTXT = true

[Author]
name = "百里江山"

[permalinks]
  posts = "/:filename/"     # 或者使用 :slug 或 :title

[params]
    # title = "空树之空"
    title = "百里觅码"
    # brand = "空树之空"
    brand = "百里觅码"
    baidu_analytics = "09ae5d3bb096d3e2cdf68ed4a01e8c8a"
    # brand_image = "/images/brand_image.jpg"
    # brand_image = "/images/head.jpg"
    brand_image = "/images/logo-code.png"
    og_image = "/images/favicon-baili.png"                             # path to social icon - front matter: image takes precedent, then og_image, then brand_url
    publisher_icon = "/images/favicon.png"                       # path to publisher icon - defaults to favicon, used in schema
    favicon = "/images/favicon.png"                              # path to favicon
    # description = "《空樹之空》博客是一个技术导向的平台，聚焦于Kubernetes（K8s）、DevOps、GitOps、运维和Linux等领域。通过简洁而优美的文字，我们提供对这些技术主题的深入探索和实用的指南。By <a href='https://github.com/yezihack' target='_blank'>@yezihack</a>"
    description = "《百里觅码》博客是一个技术导向的平台，聚焦于Kubernetes、DevOps和Linux等领域。通过简洁而优美的文字，我们提供对这些技术主题的深入探索和实用的指南。"
    dark_mode = true
    mainSections = ["posts"]

    uglyURLs = true

    menu = [
        {Name = "Posts", URL = "/posts/", HasChildren = false},
        {Name = "Categories", URL = "/categories/", HasChildren = false},
        {Name = "Tags", URL = "/tags/", HasChildren = false},
        {Name = "Bookmark", URL = "/bookmark/", HasChildren = false},
    ]
    # {Name = "Posts", URL = "/posts/", Pre = "Recent", HasChildren = true, Limit = 5},

    github_url = "https://github.com/yezihack"
    # linkedin_url = "https://linkedin.com"
    # twitter_url = "https://twitter.com"
    # discord_url = "https://discord.com"
    youtube_url = "https://youtube.com/@bailicode"
    # email_url = "mailto://freeit@126.com"

    # Adds an RSS icon to the end of the socials which links to {{ .Site.BaseURL }}/index.xml
    rss_icon = true
    # xmpp_url = true
    # Which section the RSS icon links to, defaults to all content. See https://gohugo.io/templates/rss/#section-rss
    rss_section = "posts"

    # sidebar
    sidebar_bg_color = "#202020"            # default is #202020
    sidebar_img_border_color = "#515151"    # default is #515151
    sidebar_p_color = "#909090"             # default is #909090
    sidebar_h1_color = "#FFF"               # default is #FFF
    sidebar_a_color = "#FFF"                # default is #FFF
    sidebar_socials_color = "#FFF"          # default is #FFF
    moon_sun_color = "#FFF"                 # default is #FFF
    moon_sun_background_color = "#515151"   # default is #515151

    # light mode - 柔和护眼配色（与 bookmark 统一）
    text_color = "#222"             # default is #222
    content_bg_color = "#f5f7fa"    # 柔和的浅灰蓝色（原 #FAF9F6）
    post_title_color = "#303030"    # default is #303030
    list_color = "#5a5a5a"          # default is #5a5a5a
    link_color = "#667eea"          # 紫蓝色（原 #268bd2）
    date_color = "#718096"          # 柔和灰色（原 #515151）
    table_border_color = "#e8eaf6"  # 淡紫灰色（原 #E5E5E5）
    table_stripe_color = "#f8f9fb"  # 更浅的灰蓝色（原 #F9F9F9）

    # dark mode - 柔和深色模式（与 bookmark 统一）
    text_color_dark = "#e8eaf6"         # 浅灰白色（原 #eee）
    content_bg_color_dark = "#1e1e2e"   # 深灰紫色（原 #121212）
    post_title_color_dark = "#e8eaf6"   # 浅灰白色（原 #DBE2E9）
    list_color_dark = "#b4b7c9"         # 中灰蓝色（原 #9d9d9d）
    link_color_dark = "#a78bfa"         # 淡紫色（原 #268bd2）
    date_color_dark = "#b4b7c9"         # 中灰蓝色（原 #9a9a9a）
    table_border_color_dark = "#2a2a3e" # 深灰蓝色（原 #515151）
    table_stripe_color_dark = "#252535" # 深灰紫色（原 #202020）


[params.meta]
    favicon = true
[taxonomies]
    series = 'series'
    tags = 'tags'
    categories = 'categories'

[outputs]
    home = ["HTML", "RSS", "JSON"]
